apply plugin: 'com.android.application'

// The local APK carries these resources separately from the GPL codec sources.
// Refuse a release with missing, truncated or different firmware.
tasks.register('prepareBundledFirmware') {
    doLast {
        def hashes = [
            'D002.032.bin': 'c0351f250a834660641bca3b06be931c80cc1ed0ef808356c550b99cd0f4c632',
            'd02032-core.img': 'd40398183e9aa8db6288a62d9a0e0c233cb143ef5633680abd829cc03c719f66'
        ]
        hashes.each { name, expected ->
            def destination = file("src/main/assets/firmware/${name}")
            def original = rootProject.file("../assets/vocoder/${name}")
            def source = original.isFile() ? original : destination
            if (!source.isFile()) throw new GradleException("Coloque ${name} em assets/vocoder antes de compilar o APK offline.")
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
            if (digest != expected) throw new GradleException("SHA-256 inválido para ${name}; APK não gerado.")
            if (source != destination) {
                destination.parentFile.mkdirs()
                java.nio.file.Files.copy(source.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareBundledFirmware' }

// RadioSessionService loads this helper by its exact library name.  A build
// without it installs normally but cannot initialise the vocoder, leaving RX,
// TX and PTT unavailable.  Keep the known-good 1.5.6 binaries verifiable.
tasks.register('verifyBundledVocoderHelper') {
    doLast {
        def hashes = [
            'arm64-v8a': 'ba6c59e0c08394791378d9e46e55363287d155ad90798bea6bad59001d466903',
            'armeabi-v7a': '1ccda2de1fb3f71cd31994ba31242576176b3e98ab5ce7778226a4d7114a993f'
        ]
        hashes.each { abi, expected ->
            def helper = file("src/main/jniLibs/${abi}/libqso_dmr_vocoder_helper.so")
            if (!helper.isFile()) throw new GradleException("Vocoder helper ausente para ${abi}; APK não gerado.")
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(helper.bytes).encodeHex().toString()
            if (digest != expected) throw new GradleException("SHA-256 inválido para o vocoder helper ${abi}; APK não gerado.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyBundledVocoderHelper' }

android {
    buildFeatures { buildConfig true }
    namespace = "br.radio.zapdmr"
    ndkVersion "27.0.12077973"
    externalNativeBuild { cmake { path file("src/main/cpp/car-vad/CMakeLists.txt"); version "3.22.1" } }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.radio.zapdmr"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        buildConfigField "boolean", "EXPERIMENTAL_CAR_VOX", "false"
        buildConfigField "boolean", "ZAPCHAT_TEST_BUILD", "false"
        manifestPlaceholders = [zapChatChannelId: "zapchat_messages"]
        versionCode 28
        versionName "1.5.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        zapChatTest {
            initWith release
            applicationIdSuffix ".zapchattest"
            versionNameSuffix "-zapchat-test.4"
            matchingFallbacks = ["release"]
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "ZAPCHAT_TEST_BUILD", "true"
            manifestPlaceholders = [zapChatChannelId: "zapchat_test_messages"]
        }
        carPreview {
            initWith release
            applicationIdSuffix ".carpreview"
            versionNameSuffix "-car-preview.13"
            matchingFallbacks = ["release"]
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    testOptions {
        unitTests.all {
            systemProperty 'zapdmr.firmwareAssets', file('src/main/assets/firmware').absolutePath
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == "carPreview") variant.outputs.all { versionCodeOverride = 15313 }
    if (variant.buildType.name == "zapChatTest") variant.outputs.all { versionCodeOverride = 15623 }
}
